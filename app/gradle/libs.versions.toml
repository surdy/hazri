# Version catalog for the Hazri phone app.
#
# The toolchain mirrors the author's smart-display project: AGP 9 is the first line that
# carries Kotlin Multiplatform through `com.android.kotlin.multiplatform.library`, and
# Compose Multiplatform 1.11 needs Kotlin 2.2.20+, which in turn needs AGP 9 / Gradle 9.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
# Material 3 is versioned independently of the rest of Compose Multiplatform. 1.11.0-alpha07
# is the line published alongside CMP 1.11.x; there is no 1.11.x stable of this artifact.
composeMaterial3 = "1.11.0-alpha07"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.11.0"

androidxActivity = "1.11.0"
androidxCore = "1.17.0"

# BLE scanning from common code. Android actual only for now; the iOS actual is the same
# API, which is the reason this library was chosen over a raw platform scanner.
kable = "0.37.1"
# MQTT. JVM/Android only, so it lives in :shared's androidMain behind `MqttGateway`.
hivemq = "1.3.6"

minSdk = "26"
compileSdk = "36"
targetSdk = "35"

[libraries]
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
# The multiplatform `BackHandler`. A separate artifact from `ui`, and the reason the whole
# navigation stack can stay in commonMain: without it the platform back gesture would have
# to be wired from :androidApp.
compose-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }

kable-core = { group = "com.juul.kable", name = "kable-core", version.ref = "kable" }
hivemq-mqtt-client = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemq" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
