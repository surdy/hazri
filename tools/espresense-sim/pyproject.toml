[project]
name = "espresense-sim"
version = "0.1.0"
description = "Simulated ESPresense BLE presence nodes for developing the Hazri app without hardware"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
espresense-sim = "espresense_sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["espresense_sim"]

[tool.setuptools.package-data]
# The default house and walk ship with the package so that an installed
# espresense-sim can find them; override either with --layout / --walk.
espresense_sim = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
